<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#18212E">
<title>Console L'Établi.ai</title>
<link rel="icon" href="icone.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<link rel="stylesheet" href="console.css?v=18">
</head>
<body>

<main class="porte" id="porte" hidden>
  <div class="porte-carte">
    <p class="marque">L'Établi.ai <span>Console</span></p>
    <h1>Les apps de L'Établi.ai : avis, clients, inscriptions et coûts</h1>
    <form id="f-courriel">
      <label for="in-courriel">Votre courriel</label>
      <input id="in-courriel" type="email" autocomplete="email" inputmode="email" required>
      <button class="btn plein" type="submit">Recevoir un code</button>
    </form>
    <form id="f-code" hidden>
      <label for="in-code">Code reçu par courriel</label>
      <input id="in-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" required>
      <button class="btn plein" type="submit">Ouvrir la console</button>
      <button class="lien" type="button" id="autre-courriel">Changer de courriel</button>
    </form>
    <p class="msg" id="porte-msg" role="status"></p>
  </div>
</main>

<div id="console" hidden>
  <header class="barre">
    <div class="barre-in">
      <p class="marque">L'Établi.ai <span>Console</span></p>
      <div class="barre-actions">
        <button class="lien" type="button" id="actualiser">Actualiser</button>
        <button class="lien" type="button" id="sortir">Se déconnecter</button>
      </div>
    </div>
    <nav class="onglets" id="onglets" aria-label="Sections de la console"></nav>
  </header>
  <main class="page" id="page" aria-live="polite"></main>
  <p class="pied" id="pied"></p>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-titre"></h2>
    <p id="dlg-texte"></p>
    <label id="dlg-raison-l" hidden>Note pour le journal (facultatif)<input id="dlg-raison" maxlength="200" placeholder="ex. payé par Stripe le 14 nov."></label>
    <div class="dlg-actions">
      <button class="btn" value="ok" id="dlg-ok"></button>
      <button class="btn pale" value="non">Annuler</button>
    </div>
  </form>
</dialog>
<dialog id="dlg-rep">
  <form id="rep-form">
    <h2 id="rep-titre"></h2>
    <p id="rep-info"></p>
    <label for="rep-texte">Votre réponse</label>
    <textarea id="rep-texte" rows="9" maxlength="20000" required></textarea>
    <p class="msg" id="rep-msg" role="status"></p>
    <div class="dlg-actions">
      <button class="btn" type="submit" id="rep-ok">Envoyer la réponse</button>
      <button class="btn pale" type="button" id="rep-annuler">Annuler</button>
    </div>
  </form>
</dialog>
<dialog id="dlg-saisie">
  <form id="sa-form">
    <h2 id="sa-titre"></h2>
    <p id="sa-info" class="note"></p>
    <label id="sa-l-titre" hidden>Titre<input id="sa-champ-titre" maxlength="120" placeholder="ex. Partager un spécial à un ami"></label>
    <label for="sa-texte">Texte</label>
    <textarea id="sa-texte" rows="6" maxlength="2000"></textarea>
    <label id="sa-l-statut" hidden>État de l'idée<select id="sa-statut"><option value="etudiee">À l'étude</option><option value="prevue">Prévue</option><option value="faite">Faite</option><option value="non">Non retenue</option></select></label>
    <div class="dlg-actions">
      <button class="btn" type="submit" id="sa-ok"></button>
      <button class="btn pale" type="button" id="sa-annuler">Annuler</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="console.js?v=19"></script>
</body>
</html>
